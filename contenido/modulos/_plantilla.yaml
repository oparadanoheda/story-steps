# Plantilla de módulo de proyecto. Copiar como <proyecto>-<edad>.yaml (p. ej. prehistoria-3.yaml).
# Regla de oro: recicla la lengua del núcleo y añade poca nueva.
# Un módulo sustituye sesiones de Exploit o usa el margen del trimestre; no se añade al calendario.
# Mismas convenciones que las unidades: sin rutas de medios (medios/<id del módulo>/) y palabras por id del léxico.

proyecto: Prehistoria y dinosaurios
curso: 3
estado: borrador            # borrador · revisado · pilotado

recicla_unidades: [u3, u6]  # unidades del núcleo cuya lengua se reutiliza
recicla: [big, small]       # palabras del léxico que el módulo necesita

vocabulario:                # palabras nuevas, por id del léxico. 3 años: 3-4 · 4 años: 4-6 · 5 años: 6-8
  - dinosaur

chunks:                     # una sola estructura, ya vista en el núcleo si es posible
  - texto: "Big dinosaur / small dinosaur"
    nivel: entienden

criterios: ["2.3", "1.3"]   # solo 1.3, 2.3, 3.8, 5.2, 5.4

cuento:
  titulo: ""
  descripcion: ""           # corto y repetitivo, contado con imágenes u objetos

chant:
  letra: |
    ...
  gestos: ""

tarea_manipulativa: ""      # conectada con lo que hace el aula en el proyecto
para_casa: ""               # sin exigir saber inglés

sesiones:                   # 3 años: 3 · 4 y 5 años: 3-4
  - n: 1
    arquetipo: encounter-1
    juego: listen-and-do    # comprensión en 3 años; producción en 4 y 5
    palabras: [dinosaur]
    cambios: []
    con_auxiliar: ""
    materiales: []
