# Plantilla de unidad. Copiar como u<N>-<edad>.yaml (p. ej. u1-3.yaml = unidad 1, 3 años).
# Reglas en CLAUDE.md. Contenido para los niños en inglés británico.
# El nombre del archivo es el identificador: no cambia una vez publicado.
# No se escriben rutas de medios: van por convención en medios/<id de la unidad>/ y medios/lexico/.
# Ojo con YAML: los ids "on", "no" y "yes" van entre comillas, o se leen como verdadero/falso.

curso: 3                    # 3, 4 o 5 (años)
unidad: 1                   # 1-8
titulo: Hello, school!
estado: borrador            # borrador · revisado (inglés revisado) · pilotado

vocabulario:                # nuclear: ids de contenido/comun/lexico.yaml
  - hello                   # 3 años: 4-6 · 4 años: 6-8 · 5 años: 6-8
  - goodbye                 # una palabra es nuclear una sola vez en todo el ciclo

exposicion: []              # salen en el cuento o la rutina; no cuentan ni llevan flashcard

recicla: []                 # palabras ya nucleares en unidades o cursos anteriores que esta unidad necesita

chunks:                     # 3 años: una para entender · 4 y 5 años: una para decir y una para entender
  - texto: "Sit down, please."
    nivel: entienden        # dicen · entienden · formula
  - texto: "Hello!"
    nivel: formula          # fórmula de rutina que dicen; no cuenta como estructura

criterios: ["1.3", "2.3", "5.2"]   # solo 1.3, 2.3, 3.8, 5.2, 5.4

cuento:
  titulo: ""
  paginas:                  # medios/<unidad>/cuento-01.webp y cuento-01.mp3, en este orden
    - texto: ""             # lo que lee el narrador; nunca se muestra a los niños
      corta: true           # true si la página entra en la versión corta (3 años, sesión 1)
      participan: ""        # qué hacen los niños: gesto, estribillo, palabra

chant:                      # medios/<unidad>/chant.mp3
  titulo: ""
  letra: |
    ...
  gestos: ""

sesiones:                   # 10 sesiones: 1-3 Encounter · 4-7 Engage · 8-10 Exploit
  - n: 1
    arquetipo: encounter-1  # de contenido/comun/arquetipos.yaml: aporta bloques, minutos y energía
    juego: listen-and-do    # id de contenido/comun/juegos.yaml, permitido para la edad
    palabras: [hello, goodbye]
    dice:                   # frases del docente, en inglés
      - "Hello! Look, this is Pip."
    cambios: []             # solo lo que se sale del arquetipo. Cada cambio indica la posición del bloque:
                            #   - {bloque: 4, minutos: 6, descripcion: "..."}
                            # Campos: minutos, energia, descripcion, recortable, adultos, opcional
    con_auxiliar: ""        # qué cambia si hay auxiliar (opcional; nada imprescindible depende de él)
    materiales: []          # todo cabe en una bolsa y se prepara en menos de un minuto

  - n: 8
    arquetipo: exploit-8
    juego: stop
    palabras: [hello, goodbye]
    observacion:            # obligatoria en las sesiones 8, 9 y 10
      criterios: ["2.3"]
      indicador: "Responde con el cuerpo a tres órdenes de la unidad"
    cambios: []
    con_auxiliar: ""
    materiales: []

rincon:                     # caja del rincón de inglés, desde la sesión 2
  - cuento pequeño
  - flashcards dobles
  - marionetas de palo

para_casa:                  # medios/<unidad>/casa.webp
  descripcion: ""           # sin exigir saber inglés
